services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  CmsProvenance\ProvenanceFacts\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # Instantiated by the content object renderer (postUserFunc)
  CmsProvenance\ProvenanceFacts\Frontend\ContentElementFacts:
    public: true
    shared: false

  CmsProvenance\ProvenanceFacts\Backend\CreateFactController:
    public: true

  # Used by the facts overview of the Provenance module
  CmsProvenance\ProvenanceFacts\Backend\FactOverview:
    public: true

  CmsProvenance\ProvenanceFacts\Backend\Controller\FactsModuleController:
    public: true
